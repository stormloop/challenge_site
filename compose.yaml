services:
  backend:
    build:
      context: ./backend

    env_file:
      - ./backend/.env

    environment:
      DATABASE_PATH: /app/data

    volumes:
      - ./data:/app/data

    expose:
      - "8000"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE}
        VITE_API_BASE_URL: /api

    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      - backend

    restart: unless-stopped